# The installer for this commit (recomp-launcher with launcher/launcher.json):
# artifacts on every push to main, release files on a v* tag. The game builds
# on Windows only, so only the Windows installer is made. The installer holds
# no game code: it fetches this repo and pcrecomp as source and builds from
# the player's own disc.
name: installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    uses: sp00nznet/recomp-launcher/.github/workflows/installer.yml@main
    with:
      name: MC2-Recomp-Installer
      platforms: windows
